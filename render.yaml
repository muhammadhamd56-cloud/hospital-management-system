# Render Blueprint for backend/api — see https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard as a Blueprint, then fill
# in the `sync: false` env vars (they hold secrets and are never read from
# this file). DATABASE_URL should point at an external managed Postgres
# (e.g. Neon or Supabase) rather than Render's own free Postgres, which is
# deleted after 90 days.
services:
  - type: web
    name: hospital-management-api
    runtime: node
    plan: free
    rootDir: backend/api
    # --include=dev: NODE_ENV=production (below) would otherwise skip the
    # devDependencies the build needs (@nestjs/cli, typescript).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy --schema=../../database/api/schema.prisma && node dist/main
    healthCheckPath: /api/health
    envVars:
      # Turns on Secure cookies and keeps one-time codes out of the logs.
      - key: NODE_ENV
        value: production
      # Render's load balancer + Vercel's /api rewrite. Lets the rate limiter
      # see each visitor's IP instead of the proxy's (see main.ts).
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # The frontend proxies /api through its own Vercel domain (see
      # frontend/vercel.json), so the session cookies are first-party. That
      # also means GOOGLE_CALLBACK_URL must use the Vercel domain:
      # https://<vercel-domain>/api/auth/google/callback
      - key: COOKIE_SAMESITE
        value: lax
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: PORT
        value: 3000
      # TOTP secrets are encrypted at rest with this key (32 bytes, base64 or
      # 64 hex chars). Required in production. Rotating it invalidates every
      # enrolled authenticator, so keep it stable.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      # Shared demo logins. Keep off for a real deployment.
      - key: DEMO_MODE
        value: "false"
      # Admin AI Copilot (docs/ai/AI_DEPLOYMENT.md). Off until AI_API_KEY is
      # set and the read-only rollout is verified.
      - key: ADMIN_AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_ALLOW_PHI
        value: "false"
      - key: AI_ENABLE_WRITES
        value: "false"
      - key: AI_RAG_ENABLED
        value: "false"
