name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345678
          POSTGRES_DB: hospital_management_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - run: npm ci

      - run: npx prisma generate --schema=../../database/api/schema.prisma

      - run: npm run lint

      - run: npm run test -- --maxWorkers=2

      - run: npx prisma migrate deploy --schema=../../database/api/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:12345678@localhost:5432/hospital_management_system_test?schema=public

      - run: npm run test:e2e

      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 44 pre-existing errors (react-hooks/set-state-in-effect) predate this
      # workflow -- report them without failing the build until they're fixed.
      - run: npm run lint
        continue-on-error: true

      - run: npm run test

      - run: npm run build
